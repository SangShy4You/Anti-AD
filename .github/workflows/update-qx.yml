name: Update native Quantumult X rules

on:
  schedule:
    - cron: '50 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
  push:
    paths:
      - 'config/qx-sources.json'
      - 'config/qx-*.list'
      - 'config/qx-*.conf'
      - 'config/qx-*.json'
      - 'scripts/qx_*.py'
      - 'tests/test_qx_*.py'
      - 'tests/fixtures/**'
      - '.github/workflows/update-qx.yml'

permissions: {}

concurrency:
  # Share the legacy workflow's lock because both publish to main.
  group: personal-rules-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-qx:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run native QX compiler regression tests
        run: python -m unittest discover -s tests -p 'test_qx_*.py'
      - name: Read public sources and validate immutable dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/qx_build.py
      - name: Publish changed QX resources
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- rules/quantumultx
          if git diff --cached --quiet; then
            printf '%s\n' 'QX sources and validated output are unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update native QX rules and pinned dependencies'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Explain a failed validation
        if: failure()
        run: echo 'The QX update stopped. The last published snapshot is retained. Review the failed source, new script URL, changed patch, or validation result.' >> "$GITHUB_STEP_SUMMARY"
