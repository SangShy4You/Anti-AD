# Reviewed response-only YouTube Enhance integration for Quantumult X.
# Source: https://github.com/Maasea/sgmodule (Apache-2.0).
# Keep a single protobuf response processor for ads, background playback and PiP.
# The upstream request scripts and external Worker forwarding are not imported.
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config)(\?(.*))?$ url script-response-body https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js
hostname = youtubei.googleapis.com
